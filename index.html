<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Aile bütçesi ve harcama takibi" />
    <!-- Durum çubuğu rengi: seçili temanın zemini (aşağıdaki betik ve src/lib/theme.ts günceller). -->
    <meta name="theme-color" content="#F8FAFC" />
    <!-- iOS: ana ekrana eklenince tam ekran (standalone) açılır. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bütçem" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <title>Bütçem</title>
    <script>
      // Tema tercihini ilk boyamadan önce uygula (açık/koyu yanıp sönmesini önler).
      (function () {
        var pref = 'system'
        try { pref = localStorage.getItem('theme') || 'system' } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#020617' : '#F8FAFC')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
